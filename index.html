<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="text-scale" content="scale" />
  <title>English Tutor Material — Vic</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-secondary: #334155;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #1e40af;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --success: #15803d;
      --success-bg: #f0fdf4;
      --error: #b91c1c;
      --error-bg: #fef2f2;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      font-weight: 700;
      font-size: 1.125rem;
      color: var(--muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      letter-spacing: 0.02em;
    }

    .brand:hover {
      color: var(--text);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.55rem 1rem;
      font-size: 0.98rem;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: #f1f5f9;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    /* Main Container */
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4.5rem;
    }

    /* Loading & Error States */
    .status-box {
      text-align: center;
      padding: 64px 20px;
      color: var(--muted);
    }

    .error-box {
      background: var(--error-bg);
      color: var(--error);
      border: 1px solid #fecaca;
      padding: 20px;
      border-radius: var(--radius);
      max-width: 600px;
      margin: 40px auto;
    }

    /* Lobby Quest Map (Duolingo-inspired winding path) */
    .map-header {
      max-inline-size: 680px;
      margin-inline: auto;
      margin-block-end: 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .page-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .map-progress-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.45rem 0.95rem;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .map-progress-dot {
      inline-size: 10px;
      block-size: 10px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
    }

    .quest-map {
      position: relative;
      max-inline-size: 680px;
      margin-inline: auto;
      padding-block: 1rem 3rem;
      display: flex;
      flex-direction: column;
      gap: 2.75rem;
    }

    .map-path-svg {
      position: absolute;
      inset: 0;
      display: block;
      pointer-events: none;
      z-index: 0;
      overflow: visible;
    }

    .quest-step {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
      transform: translateX(var(--step-x, 0px));
    }

    .quest-node-circle {
      inline-size: 78px;
      block-size: 78px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      background: var(--primary);
      box-shadow: 0 6px 0 #1e3a8a, 0 10px 20px -6px rgba(30, 64, 175, 0.35);
      cursor: pointer;
      transition: transform 0.14s ease, box-shadow 0.14s ease, background 0.2s ease;
      position: relative;
    }

    .quest-node-circle:hover {
      transform: translateY(-2px);
    }

    .quest-node-circle:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #1e3a8a;
    }

    .quest-node-circle.is-current::after {
      content: "";
      position: absolute;
      inset: -11px;
      border-radius: 50%;
      border: 3px solid rgba(37, 99, 235, 0.32);
      pointer-events: none;
    }

    .quest-step.is-completed .quest-node-circle {
      background: #22c55e;
      box-shadow: 0 6px 0 #15803d, 0 10px 20px -6px rgba(21, 128, 61, 0.35);
    }

    .quest-step.is-completed .quest-node-circle:active {
      box-shadow: 0 2px 0 #15803d;
    }

    .quest-step.is-locked .quest-node-circle {
      background: #e2e8f0;
      color: #94a3b8;
      box-shadow: 0 6px 0 #cbd5e1;
      cursor: not-allowed;
    }

    .quest-step.is-locked .quest-node-circle:hover,
    .quest-step.is-locked .quest-node-circle:active {
      transform: none;
    }

    .quest-node-card {
      inline-size: min(100%, 340px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
      box-shadow: 0 4px 12px -4px rgba(15, 23, 42, 0.06);
    }

    .quest-node-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -8px rgba(15, 23, 42, 0.1);
    }

    .quest-step.is-completed .quest-node-card {
      border-color: #86efac;
      background: #f0fdf4;
    }

    .quest-step.is-completed .quest-node-card:hover {
      border-color: #22c55e;
    }

    .quest-step.is-locked .quest-node-card {
      background: #f8fafc;
      border-style: dashed;
      border-color: #cbd5e1;
      box-shadow: none;
      cursor: not-allowed;
      padding: 0.75rem 1.15rem;
    }

    .quest-step.is-locked .quest-node-card:hover {
      transform: none;
      border-color: #cbd5e1;
      box-shadow: none;
    }

    .quest-node-top {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-block-end: 0.35rem;
    }

    .quest-unit-tag {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-light);
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
    }

    .quest-step.is-completed .quest-unit-tag {
      color: #15803d;
      background: #dcfce7;
    }

    .quest-node-date {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--muted);
    }

    .quest-node-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      margin-block-end: 0.3rem;
    }

    .quest-node-grammar {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--muted);
      margin-block-end: 0.5rem;
    }

    .quest-node-meta {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .quest-locked-label {
      font-size: 0.95rem;
      font-weight: 600;
      color: #94a3b8;
    }

    @media (max-width: 600px) {
      .quest-step {
        transform: translateX(calc(var(--step-x, 0px) * 0.5));
      }
    }

    /* Lesson Bottom Completion Footer */
    .lesson-footer-action {
      margin-block-start: 3rem;
      padding: 2rem 1.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1rem;
    }

    .lesson-footer-status {
      font-size: 1rem;
      font-weight: 600;
      color: var(--muted);
    }

    .lesson-footer-status.is-completed {
      color: #15803d;
    }

    .btn-complete-unit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.9rem 2.4rem;
      font-size: 1.15rem;
      font-weight: 700;
      border-radius: 12px;
      border: none;
      background: #22c55e;
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 5px 0 #15803d;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
    }

    .btn-complete-unit:hover {
      background: #16a34a;
    }

    .btn-complete-unit:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #15803d;
    }

    .btn-complete-unit.is-completed {
      background: var(--surface);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      box-shadow: 0 3px 0 #cbd5e1;
    }

    .btn-complete-unit.is-completed:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }

    /* Lesson Detail View */
    .lesson-header {
      margin-bottom: 2.25rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .lesson-date-pill {
      display: inline-block;
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-light);
      padding: 0.3rem 0.8rem;
      border-radius: 6px;
      margin-bottom: 0.65rem;
    }

    .lesson-header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .grammar-tag {
      font-size: 1.1rem;
      color: var(--muted);
    }

    /* Section Boundaries */
    .section-block {
      margin-bottom: 3.5rem;
    }

    .section-heading {
      font-size: 1.55rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      padding-left: 0.9rem;
      border-left: 4px solid var(--primary);
      color: var(--text);
    }

    /* Vocabulary Flashcards */
    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 20.5rem), 1fr));
      gap: 1.35rem;
    }

    .flashcard {
      background-color: transparent;
      border: 0;
      padding: 0;
      width: 100%;
      font: inherit;
      color: inherit;
      min-height: 14.5rem;
      perspective: 1000px;
      cursor: pointer;
      display: flex;
      border-radius: var(--radius);
    }

    .flashcard.has-image {
      min-height: 25rem;
    }

    .flashcard:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }

    .flashcard-inner {
      position: relative;
      display: grid;
      width: 100%;
      min-height: inherit;
      transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }

    .flashcard.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-front,
    .flashcard-back {
      grid-area: 1 / 1;
      width: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .flashcard-front {
      background: var(--surface);
      align-items: center;
      text-align: center;
      gap: 0.9rem;
    }

    .flashcard.has-image .flashcard-front {
      padding: 1.1rem;
      justify-content: flex-start;
    }

    .flashcard-img {
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      border-radius: 8px;
      background: #e2e8f0;
      display: block;
      flex-shrink: 0;
    }

    .flashcard-front-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
    }

    .flashcard-word-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      max-width: 100%;
    }

    .flashcard-word {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    /* 小巧低調的發音按鍵：保持老師主導權，不喧賓奪主 */
    .pronounce-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #64748b;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
      opacity: 0.7;
    }

    .pronounce-btn:hover {
      opacity: 1;
      color: var(--primary);
      border-color: var(--primary);
      background: var(--primary-light);
      transform: scale(1.05);
    }

    .pronounce-btn svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }

    .flashcard-pos {
      font-size: 1rem;
      color: var(--muted);
      margin-top: 0.4rem;
    }

    .flashcard-back {
      background: var(--primary-light);
      border-color: #bfdbfe;
      transform: rotateY(180deg);
      justify-content: space-between;
      text-align: left;
      gap: 0.85rem;
    }

    .flashcard.has-image .flashcard-back {
      padding: 1.1rem;
      justify-content: flex-start;
    }

    .flashcard-back .flashcard-img {
      aspect-ratio: 16 / 8.5;
    }

    .flashcard-back-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 0.65rem;
      justify-content: space-between;
    }

    .flashcard-meaning {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.35;
    }

    .flashcard-example {
      font-size: 1.08rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* IELTS Split Layout (Reading + Quiz) */
    .ielts-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .ielts-split {
        grid-template-columns: 1fr;
      }
    }

    .reading-pane {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.25rem;
      position: sticky;
      top: 84px;
      max-height: calc(100vh - 110px);
      overflow-y: auto;
    }

    @media (max-width: 900px) {
      .reading-pane {
        position: static;
        max-height: none;
      }
    }

    .reading-title {
      font-size: 1.65rem;
      font-weight: 800;
      margin-bottom: 1.15rem;
      padding-bottom: 0.9rem;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }

    .reading-body {
      font-size: 1.2rem;
      line-height: 1.85;
      color: var(--text-secondary);
    }

    .quiz-pane {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .question-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.6rem;
    }

    .question-card.correct {
      border-color: #86efac;
      background: var(--success-bg);
    }

    .question-card.incorrect {
      border-color: #fca5a5;
      background: var(--error-bg);
    }

    .question-type-badge {
      display: inline-block;
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .question-text {
      font-weight: 700;
      font-size: 1.2rem;
      margin-bottom: 1rem;
      color: var(--text);
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .option-label {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      cursor: pointer;
      font-size: 1.06rem;
      color: var(--text-secondary);
      transition: all 0.15s ease;
    }

    .option-label:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .option-label.opt-correct {
      border-color: #22c55e;
      background: #f0fdf4;
      color: #15803d;
      font-weight: 600;
    }

    .option-label.opt-incorrect {
      border-color: #ef4444;
      background: #fef2f2;
      color: #b91c1c;
    }

    .option-label input[type="radio"] {
      margin-top: 5px;
      accent-color: var(--primary);
    }

    .feedback-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .feedback-pill.correct {
      background: #dcfce7;
      color: #15803d;
    }

    .feedback-pill.incorrect {
      background: #fee2e2;
      color: #b91c1c;
    }

    /* 全螢幕紙花 Canvas */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    /* 低調且不顯眼的折疊解析：預設關閉，由老師主導展開 */
    .explanation-details {
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px dashed var(--border);
    }

    .explanation-summary {
      font-size: 0.85rem;
      font-weight: 500;
      color: #94a3b8;
      cursor: pointer;
      user-select: none;
      transition: color 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .explanation-summary:hover {
      color: var(--text-secondary);
    }

    .explanation-content {
      margin-top: 0.65rem;
      padding: 0.85rem 1rem;
      background: #f8fafc;
      border-radius: 6px;
      border-left: 3px solid #cbd5e1;
      font-size: 0.98rem;
      line-height: 1.65;
      color: var(--text-secondary);
    }

    /* 極簡線條進度條：不顯示數字分母，消除題數壓力 */
    .quiz-header-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 6px;
      padding: 4px 0;
    }

    .quiz-progress-track {
      flex: 1;
      height: 6px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .quiz-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-ghost-sm {
      background: transparent;
      border: 1px solid transparent;
      font-size: 0.82rem;
      color: var(--muted);
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 6px;
      transition: all 0.15s ease;
    }

    .btn-ghost-sm:hover {
      background: #f1f5f9;
      color: var(--text);
      border-color: var(--border);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="brand" id="home-btn">English Tutor Material</div>
      <div class="header-actions" id="lesson-actions" style="display: none;">
        <button class="btn" id="back-btn">← 返回關卡地圖</button>
        <button class="btn btn-primary" id="copy-link-btn">複製本堂課連結</button>
      </div>
    </div>
  </header>

  <main>
    <div id="loading-view" class="status-box">正在同步 Google 試算表教案資料庫...</div>
    <div id="error-view" class="error-box hidden"></div>

    <!-- Home: Winding Quest Map -->
    <section id="home-view" class="hidden">
      <div class="map-header">
        <h1 class="page-title">學習關卡地圖</h1>
        <div class="map-progress-pill" id="map-progress-pill">
          <span class="map-progress-dot" aria-hidden="true"></span>
          <span id="map-completed-count">已完成 0 關</span>
        </div>
      </div>
      <div class="quest-map" id="quest-map"></div>
    </section>

    <!-- Lesson Detail -->
    <section id="lesson-view" class="hidden">
      <div class="lesson-header">
        <span class="lesson-date-pill" id="lesson-date-badge"></span>
        <h1 id="lesson-title"></h1>
        <div class="grammar-tag" id="lesson-grammar"></div>
      </div>

      <!-- Vocabulary Section -->
      <div class="section-block" id="vocab-section">
        <h2 class="section-heading">Vocabulary Flashcards</h2>
        <div class="vocab-grid" id="vocab-grid"></div>
      </div>

      <!-- IELTS Reading & Quiz Section -->
      <div class="section-block" id="reading-quiz-section">
        <h2 class="section-heading">IELTS Reading &amp; Comprehension</h2>
        <div class="ielts-split">
          <article class="reading-pane">
            <h3 class="reading-title" id="reading-title"></h3>
            <div class="reading-body" id="reading-body"></div>
          </article>

          <div class="quiz-pane">
            <div class="quiz-header-bar" id="quiz-header-bar">
              <div class="quiz-progress-track" aria-label="測驗進度" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div class="quiz-progress-fill" id="quiz-progress-fill"></div>
              </div>
              <button type="button" class="btn-ghost-sm" id="reset-quiz-btn">重新作答</button>
            </div>
            <div id="quiz-container" style="display: flex; flex-direction: column; gap: 18px;"></div>
          </div>
        </div>
      </div>

      <!-- Unit Completion Toggle -->
      <div class="lesson-footer-action">
        <div class="lesson-footer-status" id="lesson-complete-status"></div>
        <button type="button" class="btn-complete-unit" id="toggle-complete-btn" aria-pressed="false">完成單元</button>
      </div>
    </section>
  </main>

  <script>
    const SPREADSHEET_ID = "1DrKwyy-L9g_nHFBFJ0joLfsDE64vBb1ymjtKiaNQJ5U";

    let db = {
      lessons: [],
      vocab: [],
      quiz: []
    };

    async function fetchSheetTab(sheetName) {
      const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`無法讀取工作表：${sheetName}`);
      const text = await res.text();
      const jsonStr = text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1);
      const data = JSON.parse(jsonStr);

      if (data.status === "error") {
        throw new Error(`工作表 ${sheetName} 讀取錯誤：${data.errors.map(e => e.message).join(", ")}`);
      }

      const cols = data.table.cols.map(c => (c.label || "").trim());
      const rows = data.table.rows || [];

      return rows.map(row => {
        const obj = {};
        cols.forEach((colName, idx) => {
          if (!colName) return;
          const cell = row.c[idx];
          let val = "";
          if (cell) {
            val = (cell.f !== undefined && cell.f !== null) ? String(cell.f) : (cell.v !== undefined && cell.v !== null ? String(cell.v) : "");
          }
          obj[colName] = val.trim();
        });
        return obj;
      }).filter(item => item.Date);
    }

    const COMPLETED_STORAGE_KEY = "vic_completed_lessons_v1";
    const COMPLETION_OVERRIDES_KEY = "vic_lesson_completion_overrides_v1";
    const DEFAULT_COMPLETED_BEFORE = "2026-10-28";
    const LOCKED_NODES_AHEAD = 4;
    const WAVE_OFFSETS_PX = [0, -76, -108, -76, 0, 76, 108, 76];
    let questResizeObserver = null;

    function getCompletionOverrides() {
      const map = {};
      try {
        // Migrate legacy completed-only list if present
        const legacyRaw = localStorage.getItem(COMPLETED_STORAGE_KEY);
        if (legacyRaw) {
          const legacyArr = JSON.parse(legacyRaw);
          if (Array.isArray(legacyArr)) {
            legacyArr.forEach(d => {
              if (typeof d === "string" && d) map[d] = true;
            });
          }
        }
        const raw = localStorage.getItem(COMPLETION_OVERRIDES_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === "object") {
            Object.entries(parsed).forEach(([k, v]) => {
              map[k] = Boolean(v);
            });
          }
        }
      } catch {
        // Ignore storage errors in restricted environments
      }
      return map;
    }

    function isLessonCompleted(dateStr) {
      const overrides = getCompletionOverrides();
      if (Object.prototype.hasOwnProperty.call(overrides, dateStr)) {
        return overrides[dateStr];
      }
      // 歷史歸檔單元（早於 2026-10-28）預設自動標記為已完成
      return dateStr < DEFAULT_COMPLETED_BEFORE;
    }

    function getCompletedLessons() {
      const completed = new Set();
      db.lessons.forEach(l => {
        if (isLessonCompleted(l.Date)) {
          completed.add(l.Date);
        }
      });
      return completed;
    }

    function toggleLessonCompleted(dateStr) {
      const overrides = getCompletionOverrides();
      const nextState = !isLessonCompleted(dateStr);
      overrides[dateStr] = nextState;
      try {
        localStorage.setItem(COMPLETION_OVERRIDES_KEY, JSON.stringify(overrides));
      } catch {
        // Ignore storage errors in restricted environments
      }
      return nextState;
    }

    async function init() {
      try {
        const [lessons, vocab, quiz] = await Promise.all([
          fetchSheetTab("Lessons"),
          fetchSheetTab("Vocab"),
          fetchSheetTab("Quiz")
        ]);

        // 依日期由早到晚排列，對應關卡由 Unit 1 往前推進
        db.lessons = lessons.sort((a, b) => a.Date.localeCompare(b.Date));
        db.vocab = vocab;
        db.quiz = quiz;

        document.getElementById("loading-view").classList.add("hidden");
        routeFromURL();
      } catch (err) {
        document.getElementById("loading-view").classList.add("hidden");
        const errBox = document.getElementById("error-view");
        errBox.textContent = `載入失敗：${err.message}。請確認 Google 試算表已設為「知道連結的使用者皆可檢視」，且分頁名稱為 Lessons、Vocab、Quiz。`;
        errBox.classList.remove("hidden");
      }
    }

    function routeFromURL() {
      const params = new URLSearchParams(window.location.search);
      const targetDate = params.get("date");

      if (targetDate && db.lessons.some(l => l.Date === targetDate)) {
        renderLesson(targetDate);
      } else {
        renderHome();
      }
    }

    function navigateTo(dateStr) {
      const url = new URL(window.location.href);
      if (dateStr) {
        url.searchParams.set("date", dateStr);
      } else {
        url.searchParams.delete("date");
      }
      window.history.pushState({}, "", url);
      routeFromURL();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function drawQuestPath() {
      const mapEl = document.getElementById("quest-map");
      const svg = mapEl ? mapEl.querySelector(".map-path-svg") : null;
      if (!mapEl || !svg) return;

      const steps = Array.from(mapEl.querySelectorAll(".quest-step"));
      if (steps.length < 2) {
        svg.innerHTML = "";
        return;
      }

      const mapRect = mapEl.getBoundingClientRect();
      if (mapRect.width === 0 || mapRect.height === 0) return;

      svg.setAttribute("viewBox", `0 0 ${mapRect.width} ${mapRect.height}`);
      svg.style.inlineSize = `${mapRect.width}px`;
      svg.style.blockSize = `${mapRect.height}px`;

      const points = steps.map(step => {
        const circle = step.querySelector(".quest-node-circle");
        const r = circle.getBoundingClientRect();
        return {
          x: r.left - mapRect.left + r.width / 2,
          y: r.top - mapRect.top + r.height / 2,
          completed: step.classList.contains("is-completed"),
          locked: step.classList.contains("is-locked")
        };
      });

      const paths = [];
      for (let i = 0; i < points.length - 1; i++) {
        const p1 = points[i];
        const p2 = points[i + 1];
        const midY = (p1.y + p2.y) / 2;
        const d = `M ${p1.x} ${p1.y} C ${p1.x} ${midY}, ${p2.x} ${midY}, ${p2.x} ${p2.y}`;

        let stroke = "#cbd5e1";
        let width = 6;
        let dash = "";
        if (p1.completed && !p2.locked) {
          stroke = "#22c55e";
        } else if (p2.locked) {
          stroke = "#cbd5e1";
          width = 5;
          dash = `stroke-dasharray="8 8"`;
        }

        paths.push(
          `<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${width}" stroke-linecap="round" ${dash} />`
        );
      }

      svg.innerHTML = paths.join("");
    }

    function renderHome() {
      document.getElementById("lesson-view").classList.add("hidden");
      document.getElementById("lesson-actions").style.display = "none";
      const homeView = document.getElementById("home-view");
      const mapEl = document.getElementById("quest-map");
      mapEl.innerHTML = "";

      const completedSet = getCompletedLessons();
      const completedRealCount = db.lessons.filter(l => completedSet.has(l.Date)).length;
      document.getElementById("map-completed-count").textContent = `已完成 ${completedRealCount} 關`;

      if (db.lessons.length === 0) {
        mapEl.innerHTML = `<p style="color: var(--muted); text-align: center;">目前試算表中尚無課程資料。</p>`;
        homeView.classList.remove("hidden");
        return;
      }

      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.classList.add("map-path-svg");
      svg.setAttribute("aria-hidden", "true");
      mapEl.appendChild(svg);

      const firstUncompletedIndex = db.lessons.findIndex(l => !completedSet.has(l.Date));

      db.lessons.forEach((lesson, idx) => {
        const vocabCount = db.vocab.filter(v => v.Date === lesson.Date).length;
        const isCompleted = completedSet.has(lesson.Date);
        const isCurrent = idx === firstUncompletedIndex;
        const unitLabel = `UNIT ${String(idx + 1).padStart(2, "0")}`;
        const offsetX = WAVE_OFFSETS_PX[idx % WAVE_OFFSETS_PX.length];

        const step = document.createElement("div");
        step.className = `quest-step${isCompleted ? " is-completed" : ""}`;
        step.style.setProperty("--step-x", `${offsetX}px`);

        const circleIcon = isCompleted
          ? `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>`
          : String(idx + 1).padStart(2, "0");

        const circleBtn = document.createElement("button");
        circleBtn.type = "button";
        circleBtn.className = `quest-node-circle${isCurrent ? " is-current" : ""}`;
        circleBtn.setAttribute("aria-label", `${unitLabel} ${lesson.Title || ""}`);
        circleBtn.innerHTML = circleIcon;
        circleBtn.addEventListener("click", () => navigateTo(lesson.Date));

        const cardBtn = document.createElement("button");
        cardBtn.type = "button";
        cardBtn.className = "quest-node-card";
        cardBtn.style.textAlign = "center";
        cardBtn.innerHTML = `
          <div class="quest-node-top">
            <span class="quest-unit-tag">${unitLabel}${isCompleted ? " · 已完成" : ""}</span>
            <span class="quest-node-date">${escapeHtml(lesson.Date)}</span>
          </div>
          <div class="quest-node-title">${escapeHtml(lesson.Title || "Untitled Lesson")}</div>
          ${lesson.Grammar_Focus ? `<div class="quest-node-grammar">${escapeHtml(lesson.Grammar_Focus)}</div>` : ""}
          <div class="quest-node-meta">單字：${vocabCount} 個</div>
        `;
        cardBtn.addEventListener("click", () => navigateTo(lesson.Date));

        step.appendChild(circleBtn);
        step.appendChild(cardBtn);
        mapEl.appendChild(step);
      });

      // 延伸未開放的鎖定關卡（看不到標題、不可點選，讓學生看見前方仍有路要走）
      const totalVisibleSteps = Math.max(db.lessons.length + LOCKED_NODES_AHEAD, 6);
      const lockedCount = totalVisibleSteps - db.lessons.length;

      for (let j = 0; j < lockedCount; j++) {
        const idx = db.lessons.length + j;
        const unitLabel = `UNIT ${String(idx + 1).padStart(2, "0")}`;
        const offsetX = WAVE_OFFSETS_PX[idx % WAVE_OFFSETS_PX.length];
        const fadeOpacity = Math.max(0.45, 0.85 - j * 0.12);

        const step = document.createElement("div");
        step.className = "quest-step is-locked";
        step.style.setProperty("--step-x", `${offsetX}px`);
        step.style.opacity = String(fadeOpacity);
        step.setAttribute("aria-disabled", "true");

        step.innerHTML = `
          <div class="quest-node-circle" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          </div>
          <div class="quest-node-card">
            <div class="quest-locked-label">${unitLabel} · 尚未解鎖</div>
          </div>
        `;
        mapEl.appendChild(step);
      }

      homeView.classList.remove("hidden");
      requestAnimationFrame(drawQuestPath);

      if (!questResizeObserver && "ResizeObserver" in window) {
        questResizeObserver = new ResizeObserver(() => drawQuestPath());
        questResizeObserver.observe(mapEl);
      }
    }

    function renderLesson(dateStr) {
      const lesson = db.lessons.find(l => l.Date === dateStr);
      if (!lesson) return renderHome();

      document.getElementById("home-view").classList.add("hidden");
      document.getElementById("lesson-actions").style.display = "flex";
      const lessonView = document.getElementById("lesson-view");

      document.getElementById("lesson-date-badge").textContent = lesson.Date;
      document.getElementById("lesson-title").textContent = lesson.Title;
      document.getElementById("lesson-grammar").textContent = lesson.Grammar_Focus || "";

      const lessonVocab = db.vocab.filter(v => v.Date === dateStr);
      const vocabSection = document.getElementById("vocab-section");
      const vocabGrid = document.getElementById("vocab-grid");
      vocabGrid.innerHTML = "";

      if (lessonVocab.length === 0) {
        vocabSection.classList.add("hidden");
      } else {
        vocabSection.classList.remove("hidden");
        lessonVocab.forEach(v => {
          const imgUrl = isSafeImageUrl(v.Image_URL) ? v.Image_URL.trim() : "";
          const hasImage = Boolean(imgUrl);

          const card = document.createElement("button");
          card.type = "button";
          card.className = hasImage ? "flashcard has-image" : "flashcard";
          card.setAttribute("aria-pressed", "false");

          const frontImgHtml = hasImage
            ? `<img class="flashcard-img" src="${escapeHtml(imgUrl)}" alt="${escapeHtml(v.Word)}" width="320" height="200" loading="lazy" />`
            : "";
          const backImgHtml = hasImage
            ? `<img class="flashcard-img" src="${escapeHtml(imgUrl)}" alt="" width="320" height="160" loading="lazy" fetchpriority="low" />`
            : "";

          card.innerHTML = `
            <div class="flashcard-inner">
              <div class="flashcard-front">
                ${frontImgHtml}
                <div class="flashcard-front-text">
                  <div class="flashcard-word-row">
                    <div class="flashcard-word">${escapeHtml(v.Word)}</div>
                    <button type="button" class="pronounce-btn" aria-label="聆聽「${escapeHtml(v.Word)}」發音" title="發音（供輔助核對）">
                      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                    </button>
                  </div>
                  ${v.POS ? `<div class="flashcard-pos">(${escapeHtml(v.POS)})</div>` : ""}
                </div>
              </div>
              <div class="flashcard-back">
                ${backImgHtml}
                <div class="flashcard-back-body">
                  <div class="flashcard-meaning">${escapeHtml(v.Meaning)}</div>
                  <div class="flashcard-example">${escapeHtml(v.Example)}</div>
                </div>
              </div>
            </div>
          `;

          if (hasImage) {
            const imgs = card.querySelectorAll(".flashcard-img");
            imgs.forEach(img => {
              img.addEventListener("error", () => {
                imgs.forEach(el => el.remove());
                card.classList.remove("has-image");
              }, { once: true });
            });
          }

          const pronBtn = card.querySelector(".pronounce-btn");
          if (pronBtn) {
            pronBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              speakWord(v.Word);
            });
          }

          card.addEventListener("click", (e) => {
            if (e.target.closest(".pronounce-btn")) return;
            const flipped = card.classList.toggle("flipped");
            card.setAttribute("aria-pressed", String(flipped));
          });
          vocabGrid.appendChild(card);
        });
      }

      const lessonQuiz = db.quiz.filter(q => q.Date === dateStr);
      document.getElementById("reading-title").textContent = lesson.Reading_Title || "Reading Passage";
      const safePassage = escapeHtml(lesson.Reading_Passage || "").replace(/&lt;br\s*\/?&gt;/gi, "<br>");
      document.getElementById("reading-body").innerHTML = safePassage;

      const quizContainer = document.getElementById("quiz-container");
      const progressFill = document.getElementById("quiz-progress-fill");
      quizContainer.innerHTML = "";
      if (progressFill) {
        progressFill.style.width = "0%";
        const track = progressFill.parentElement;
        if (track) track.setAttribute("aria-valuenow", "0");
      }

      lessonQuiz.forEach((q, idx) => {
        const qCard = document.createElement("div");
        qCard.className = "question-card";
        qCard.dataset.index = idx;

        const isTFNG = (q.Type || "").toUpperCase() === "TFNG";
        const typeLabel = isTFNG ? "TRUE / FALSE / NOT GIVEN" : "MULTIPLE CHOICE";

        let optionsHtml = "";
        if (isTFNG) {
          ["TRUE", "FALSE", "NOT GIVEN"].forEach(val => {
            optionsHtml += `
              <label class="option-label" data-value="${val}">
                <input type="radio" name="q_${idx}" value="${val}" />
                <span>${val}</span>
              </label>
            `;
          });
        } else {
          const opts = [
            { key: "A", text: q.Option_A },
            { key: "B", text: q.Option_B },
            { key: "C", text: q.Option_C },
            { key: "D", text: q.Option_D }
          ].filter(o => o.text && o.text !== "-");

          opts.forEach(o => {
            optionsHtml += `
              <label class="option-label" data-value="${o.key}">
                <input type="radio" name="q_${idx}" value="${o.key}" />
                <span><strong>(${o.key})</strong> ${escapeHtml(o.text)}</span>
              </label>
            `;
          });
        }

        qCard.innerHTML = `
          <div class="question-type-badge">Question ${idx + 1} · ${typeLabel}</div>
          <div class="question-text">${escapeHtml(q.Question)}</div>
          <div class="options-list">${optionsHtml}</div>
          <div id="feedback_pill_${idx}" style="margin-top: 10px;"></div>
          <details class="explanation-details" id="exp_${idx}">
            <summary class="explanation-summary">▸ 展開解析提示與證據（點擊查看）</summary>
            <div class="explanation-content">
              <div><strong>正確答案：</strong>${escapeHtml(q.Answer)}</div>
              <div style="margin-top: 4px;">${escapeHtml(q.Explanation || "")}</div>
            </div>
          </details>
        `;

        // 即時回饋：點選選項瞬間判定與微多巴胺慶祝
        const radios = qCard.querySelectorAll(`input[name="q_${idx}"]`);
        radios.forEach(radio => {
          radio.addEventListener("change", (e) => {
            handleInstantQuizFeedback(idx, q, e.target.value, qCard, lessonQuiz);
          });
        });

        quizContainer.appendChild(qCard);
      });

      document.getElementById("reset-quiz-btn").onclick = () => renderLesson(dateStr);

      const syncCompleteUI = (isCompleted) => {
        const statusEl = document.getElementById("lesson-complete-status");
        const toggleBtn = document.getElementById("toggle-complete-btn");
        if (isCompleted) {
          statusEl.textContent = "✓ 本單元已完成（關卡已點亮）";
          statusEl.classList.add("is-completed");
          toggleBtn.textContent = "尚未完成本單元";
          toggleBtn.classList.add("is-completed");
          toggleBtn.setAttribute("aria-pressed", "true");
        } else {
          statusEl.textContent = "完成單字與閱讀練習後，按下按鈕點亮地圖關卡";
          statusEl.classList.remove("is-completed");
          toggleBtn.textContent = "完成單元";
          toggleBtn.classList.remove("is-completed");
          toggleBtn.setAttribute("aria-pressed", "false");
        }
      };

      syncCompleteUI(getCompletedLessons().has(dateStr));
      document.getElementById("toggle-complete-btn").onclick = () => {
        const nowCompleted = toggleLessonCompleted(dateStr);
        syncCompleteUI(nowCompleted);
        if (nowCompleted) {
          launchFullCelebration();
        }
      };

      lessonView.classList.remove("hidden");
    }

    function handleInstantQuizFeedback(idx, q, selectedVal, qCard, allQuestions) {
      const userAns = (selectedVal || "").trim().toUpperCase();
      const rightAns = (q.Answer || "").trim().toUpperCase();
      const isCorrect = userAns === rightAns;

      const labels = qCard.querySelectorAll(".option-label");
      labels.forEach(lbl => {
        lbl.classList.remove("opt-correct", "opt-incorrect");
        const val = (lbl.dataset.value || "").trim().toUpperCase();
        if (isCorrect && val === rightAns) {
          lbl.classList.add("opt-correct");
        } else if (!isCorrect && val === userAns) {
          lbl.classList.add("opt-incorrect");
        }
      });

      qCard.classList.remove("correct", "incorrect");
      qCard.classList.add(isCorrect ? "correct" : "incorrect");

      const pillBox = document.getElementById(`feedback_pill_${idx}`);
      if (pillBox) {
        pillBox.innerHTML = isCorrect
          ? `<span class="feedback-pill correct">✓ 答對了！</span>`
          : ""; // 答錯時不顯示任何文字，由老師口頭引導
      }

      // 注意：解析 details 保持關閉，絕不自動展開，完全由老師視教學需要手動點開
      const detailsEl = document.getElementById(`exp_${idx}`);
      if (detailsEl && !isCorrect) {
        detailsEl.removeAttribute("open");
      }

      // 答對時噴發局部微型彩帶慶祝
      if (isCorrect) {
        const rect = qCard.getBoundingClientRect();
        launchConfetti(rect.left + rect.width / 2, rect.top + 30, 26);
      }

      updateQuizProgress(allQuestions);
    }

    function updateQuizProgress(questions) {
      let answeredCount = 0;
      let correctCount = 0;

      questions.forEach((q, idx) => {
        const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
        if (selected) {
          answeredCount++;
          if (selected.value.trim().toUpperCase() === (q.Answer || "").trim().toUpperCase()) {
            correctCount++;
          }
        }
      });

      // 極簡線條進度：純視覺線條推進，不顯示任何數字分母
      const progressFill = document.getElementById("quiz-progress-fill");
      if (progressFill && questions.length > 0) {
        const pct = Math.round((answeredCount / questions.length) * 100);
        progressFill.style.width = `${pct}%`;
        const track = progressFill.parentElement;
        if (track) track.setAttribute("aria-valuenow", String(pct));
      }

      // 全部答對時觸發大慶祝盛典
      if (answeredCount === questions.length && correctCount === questions.length) {
        launchFullCelebration();
      }
    }

    function speakWord(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      // 清理單字文本（拿掉省略號、括號等，只朗讀真實英文詞彙）
      const cleaned = text
        .replace(/\.{2,}/g, " ")
        .replace(/\([^)]*\)/g, " ")
        .replace(/one's/gi, "someone's")
        .replace(/\s+/g, " ")
        .trim();

      if (!cleaned) return;
      const utter = new SpeechSynthesisUtterance(cleaned);
      utter.lang = "en-US";
      utter.rate = 0.88; // 稍微放慢語速，讓國中生聽清細部發音
      window.speechSynthesis.speak(utter);
    }

    /* 原生輕量 Canvas 紙花（Confetti）動畫系統 */
    let confettiParticles = [];
    let confettiAnimationId = null;

    function getConfettiCanvas() {
      let canvas = document.getElementById("confetti-canvas");
      if (!canvas) {
        canvas = document.createElement("canvas");
        canvas.id = "confetti-canvas";
        document.body.appendChild(canvas);
      }
      if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      return canvas;
    }

    function launchConfetti(originX, originY, count = 25) {
      const colors = ["#3b82f6", "#10b981", "#f59e0b", "#ec4899", "#8b5cf6", "#06b6d4"];
      for (let i = 0; i < count; i++) {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.6;
        const speed = 4 + Math.random() * 7;
        confettiParticles.push({
          x: originX,
          y: originY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 5 + Math.random() * 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 12,
          alpha: 1,
          decay: 0.015 + Math.random() * 0.015
        });
      }
      if (!confettiAnimationId) {
        runConfettiLoop();
      }
    }

    function launchFullCelebration() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      launchConfetti(w * 0.25, h * 0.4, 50);
      launchConfetti(w * 0.75, h * 0.4, 50);
    }

    function runConfettiLoop() {
      const canvas = getConfettiCanvas();
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      confettiParticles = confettiParticles.filter(p => p.alpha > 0);

      confettiParticles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.25; // 重力
        p.vx *= 0.98; // 阻力
        p.rotation += p.rotationSpeed;
        p.alpha -= p.decay;

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();
      });

      if (confettiParticles.length > 0) {
        confettiAnimationId = requestAnimationFrame(runConfettiLoop);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        confettiAnimationId = null;
      }
    }

    function isSafeImageUrl(url) {
      if (!url) return false;
      const trimmed = String(url).trim();
      return /^https?:\/\/.+/i.test(trimmed) || /^images\/[a-zA-Z0-9._\-\/]+$/.test(trimmed);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    document.getElementById("home-btn").addEventListener("click", () => navigateTo(null));
    document.getElementById("back-btn").addEventListener("click", () => navigateTo(null));
    document.getElementById("copy-link-btn").addEventListener("click", async () => {
      const btn = document.getElementById("copy-link-btn");
      await navigator.clipboard.writeText(window.location.href);
      const orig = btn.textContent;
      btn.textContent = "已複製專屬連結 ✓";
      setTimeout(() => (btn.textContent = orig), 2000);
    });

    window.addEventListener("popstate", routeFromURL);
    init();
  </script>
</body>
